name: Auto-tag patch release

on:
  push:
    branches: [main]
    # Only changes that alter the shipped binary or its packaging. Docs, e2e
    # harness and CI config produce an identical .deb, so they don't earn a
    # version.
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yaml"
      - "deploy/**"

permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: tag
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            version="${latest#v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Bumping ${latest:-<none>} -> $next"

      - name: Create and push tag
        run: |
          git tag "${{ steps.tag.outputs.next }}"
          git push origin "${{ steps.tag.outputs.next }}"

      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yaml --ref "${{ steps.tag.outputs.next }}"
