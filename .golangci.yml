version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        - G104
        - G115
        - G404
        # G304: strategy DNA is read from an operator-supplied path by design.
        - G304
        # G204: nft/ethtool are invoked with controlled, non-user arguments.
        - G204

formatters:
  enable:
    - gofmt
    - goimports
